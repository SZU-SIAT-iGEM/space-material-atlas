<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/assets/steward.svg"><title>图谱内容工作台</title><link rel="stylesheet" href="/admin/style.css"></head>
<body>
<header class="masthead"><a class="brand" href="/" aria-label="太空物质循环图谱 · 内容工作台"><img class="brand-mark" src="/assets/steward.svg" alt="" width="48" height="48"><span><b>太空物质循环图谱</b><small>SPACE MATERIAL ATLAS</small></span></a><div class="header-right"><span class="local-indicator">内容工作台 / CONTENT STUDIO</span><select id="studio-language" aria-label="Interface language"><option value="en">EN</option><option value="zh">中文</option></select><button id="refresh">重新载入</button><button class="primary" id="build">构建预览 ↗</button></div></header>
<div class="intro"><div><p class="eyebrow">CONTENT & VERSIONS</p><h1>内容与版本管理</h1><p class="subtitle">维护队伍与基础图，校对资料，为每次发布留下完整版本。</p></div><div id="stats" class="stats" aria-label="内容概况"></div></div>
<nav class="workspaces" aria-label="工作区"><button data-workspace="teams" class="active">01 <span>队伍管理</span></button><button data-workspace="shared">02 <span>基础与共享内容</span></button><button data-workspace="import">03 <span>导入与校对</span></button><button data-workspace="versions">04 <span>版本与发布</span></button></nav>
<div id="notice" role="status" hidden></div><div id="job" class="job" hidden aria-live="polite"></div>
<main id="workspace"><aside id="catalog"><div class="catalog-heading"><h2 id="catalog-title">队伍目录</h2><button id="new-team" aria-label="新增队伍">＋ 新增</button></div><label class="search"><span>搜索内容</span><input id="filter" type="search" placeholder="队名、年份或主题"></label><div class="filters"><select id="year" aria-label="按年份筛选"><option value="">全部年份</option></select><select id="integrated" aria-label="按建模状态筛选"><option value="">全部状态</option><option value="yes">已有路线</option><option value="no">等待增补</option></select><select id="topic" aria-label="Filter by topic"><option value="">全部主题</option></select></div><div id="module-list"></div></aside><section id="editor"><div class="empty"><span class="orbital">◎</span><h2>选择一份内容开始维护</h2><p>每支队伍独立保存，共享节点通过引用连接。</p></div></section></main>
<dialog id="review"><div class="dialog-heading"><div><p class="eyebrow">REVIEW CHANGES</p><h2>检查本次修改</h2></div><button id="close-review" aria-label="关闭修改检查">×</button></div><div id="impact"></div><div id="diff"></div><label class="field">修改原因<textarea id="reason" rows="2" placeholder="例如：根据新版结果页修订产物说明"></textarea></label><div class="dialog-actions"><button id="cancel-review">继续编辑</button><button id="apply" class="primary">应用到内容库</button></div></dialog>
<dialog id="new-dialog"><div class="dialog-heading"><h2>新增队伍</h2><button id="close-new" aria-label="关闭新增队伍">×</button></div><form id="new-form"><label class="field">年份<input id="new-year" type="number" value="2027" min="2004" max="2100" required></label><label class="field">队伍编号<input id="new-id" placeholder="例如 6100 或唯一英文标识" pattern="[A-Za-z0-9_-]+" required></label><label class="field">队名<input id="new-name" required></label><label class="field">Wiki 地址<input id="new-wiki" type="url" placeholder="https://2027.igem.wiki/your-team"></label><p class="muted">先建立名录，可保存草稿并逐步补充项目路线。</p><div class="dialog-actions"><button type="submit" class="primary">创建编辑草稿</button></div></form></dialog>
<script src="/admin/i18n.js"></script><script src="/admin/app.js"></script></body></html>
