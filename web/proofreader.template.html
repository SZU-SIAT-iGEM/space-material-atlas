<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON 文本校对台</title><style>
body{margin:0;background:#f7f6f0;color:#223f49;font:14px/1.6 'Microsoft YaHei',sans-serif}*{box-sizing:border-box}header{padding:22px 28px;background:#fff;border-bottom:1px solid #ccd9d3}h1{margin:0;font:28px Georgia,'SimSun',serif}button,input,select,textarea{font:inherit;color:inherit;border:1px solid #bacdc5;border-radius:3px;background:#fff;padding:8px}button{cursor:pointer}button:hover{background:#e5eee9}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.filters{position:sticky;top:0;background:#f7f6f0;z-index:5;padding:10px 28px;border-bottom:1px solid #d5dfd8}.filters .bar{margin:0}#search{min-width:260px;flex:1}main{max-width:1400px;margin:auto;padding:18px 28px}.row{background:white;border:1px solid #d5dfd8;margin:0 0 18px;padding:18px}.row.changed{border-left:4px solid #b08036}.row-head{display:flex;justify-content:space-between;gap:12px}.context{font-size:12px;color:#52726b;overflow-wrap:anywhere}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:12px}.pair.single{grid-template-columns:1fr}.field{display:flex;flex-direction:column;gap:5px}.field textarea{width:100%;min-height:98px;resize:vertical}.path{font:11px Consolas,monospace;color:#6f817b;overflow-wrap:anywhere}.original{white-space:pre-wrap;overflow-wrap:anywhere;color:#6e7d77;font-size:12px;margin:8px 0}.small{font-size:12px;color:#627b73}.badge{font-size:12px;color:#936321}.marks{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.note{flex:1;min-width:180px}.sources a{margin-right:14px;color:#267369}#notice{min-height:22px;color:#97632f}details{margin-top:8px}#pager{display:flex;justify-content:center;gap:14px;padding:20px}a{color:#267369}label{font-size:12px}input[type=checkbox]{vertical-align:middle}@media(max-width:750px){header,main,.filters{padding:16px}.pair{grid-template-columns:1fr}.row-head{display:block}#search{min-width:100%}}</style>
<header><select id="studio-language" aria-label="Interface language"><option value="en">EN</option><option value="zh">中文</option></select><h1>JSON 文本校对台</h1><p class="small">在本机扫描中英文文本，修改、标记与核查来源。内容不会上传。修改后的 JSON 保留原结构；校对标记、标签和备注存入独立校对工程。</p><div class="bar"><button id="load-current">载入当前图谱文本</button><label>导入 JSON / 校对工程 <input id="files" type="file" accept=".json,application/json" multiple></label><button id="export-json">导出修改后的 JSON</button><button id="export-project">保存校对工程</button><button id="export-changes">导出改动清单</button><button id="restore">恢复本机暂存</button></div><div id="notice" role="status"></div></header>
<section class="filters"><div class="bar"><input id="search" placeholder="搜索文本、队名、节点 ID、JSON 路径或备注"><select id="file-filter"><option value="">全部文件</option></select><select id="change-filter"><option value="all">全部修改状态</option><option value="changed">仅已修改</option><option value="unchanged">仅未修改</option></select><select id="review-filter"><option value="all">全部校对状态</option><option value="unreviewed">未校对</option><option value="reviewed">已校对</option><option value="check">待事实核查</option></select><input id="tag-filter" placeholder="按标签筛选" style="width:140px"><label><input id="technical" type="checkbox">显示 ID、链接等技术字段</label><label><input id="originals" type="checkbox">显示原文</label></div><div id="count" class="small"></div></section>
<main><p class="small">建议校对 data/baseline.json、projects.json、roster.json 与 site-config.json。atlas.json 的布局和场景是派生成品，修改它不会自动回写源数据。相同文字可能存在于 description 与 narrative；可逐项修改，或使用“同记录同步同文”。来源链接仅供人工核查，本工具不判断事实真伪。</p><div id="rows"></div><div id="pager"></div></main>
<script id="current-data" type="application/json">__PROOF_DATA__</script><script>__DOWNLOAD_UTILS__</script><script src="/admin/i18n.js"></script><script>
'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clone=x=>JSON.parse(JSON.stringify(x)),K='space-atlas-proofreader-1';let docs=[],page=0,rows=[],filtered=[],timer;
const pointer=p=>'/'+p.map(x=>String(x).replaceAll('~','~0').replaceAll('/','~1')).join('/'),get=(o,p)=>p.reduce((x,k)=>x[k],o);function put(doc,p,v){if(!p.length)doc.data=v;else get(doc.data,p.slice(0,-1))[p.at(-1)]=v}
function notice(s){$('#notice').textContent=s}function technical(k,v){return /(^id$|_ids?$|^owner$|^route$|^schema_version$|^format$|^kind$|^category$|^layer$|^theme$|^primary_theme$|^scenario$|^basis$|^url$|_url$|^as_of$|^boundary_role$|^display_theme$|^target_view$|^fingerprint$|^source$|^target$)/.test(k)||/^https?:\/\//.test(v)}
function scan(doc){const out=[];function walk(o,p=[],record=null,rpath=[]){if(o&&typeof o==='object'&&!Array.isArray(o)&&typeof o.id==='string'){record=o;rpath=p}if(typeof o==='string'){add([p],[T('文本')],record,rpath);return}if(!o||typeof o!=='object')return;const used=new Set();if(!Array.isArray(o)&&typeof o.zh==='string'&&typeof o.en==='string'){add([[...p,'zh'],[...p,'en']],[T('中文'),'English'],record,rpath);used.add('zh');used.add('en')}for(const [k,v] of Object.entries(o)){if(used.has(k))continue;if(typeof v==='string'&&typeof o[k+'_en']==='string'){add([[...p,k],[...p,k+'_en']],[T('中文'),'English'],record,rpath);used.add(k+'_en')}else walk(v,[...p,Array.isArray(o)?Number(k):k],record,rpath)}}
function add(paths,langs,record,rpath){const key=pointer(paths[0]),context=record?(record.name||record.label?.zh||record.title||record.id)+' · '+record.id:T('根文档');out.push({doc,key,paths,langs,record,rpath,context,technical:paths.every(p=>technical(String(p.at(-1)),get(doc.data,p))||p.some(k=>/(^source_ids$|^step_ids$|^edge_ids$|^overview_edge_ids$)/.test(String(k)))),values:()=>paths.map(p=>get(doc.data,p)),original:()=>paths.map(p=>get(doc.original,p))})}walk(doc.data);return out}
function changed(r){return r.values().some((v,i)=>v!==r.original()[i])}function mark(r){return r.doc.marks[r.key]||{status:'unreviewed',tags:'',note:''}}
function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(K,JSON.stringify({format:K,docs}));notice(T('已在本机暂存；建议保存校对工程作为备份。'))}catch{notice(T('本机暂存空间不足，请保存校对工程。'))}},250)}
function sourceLinks(r){const found=[];if(r.record?.url)found.push({title:r.record.title||T('原始链接'),url:r.record.display_url||r.record.url});const ids=new Set(r.record?.source_ids||[]);function walk(o){if(!o||typeof o!=='object')return;if(o.id&&ids.has(o.id)&&o.url)found.push({title:o.title||o.id,url:o.display_url||o.url});for(const v of Object.values(o))if(v&&typeof v==='object')walk(v)}for(const d of docs)walk(d.data);return [...new Map(found.filter(x=>/^https?:\/\//.test(x.url)).map(s=>[s.url,s])).values()].map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join('')}
function render(){rows=docs.flatMap(scan);const q=$('#search').value.toLowerCase(),tag=$('#tag-filter').value.toLowerCase(),review=$('#review-filter').value,ch=$('#change-filter').value;filtered=rows.filter(r=>{const m=mark(r);return ($('#technical').checked||!r.technical)&&(!$('#file-filter').value||r.doc.id===$('#file-filter').value)&&(ch==='all'||changed(r)===(ch==='changed'))&&(review==='all'||m.status===review)&&(!tag||m.tags.toLowerCase().includes(tag))&&`${r.context} ${r.key} ${r.values().join(' ')} ${m.note} ${m.tags}`.toLowerCase().includes(q)});page=Math.min(page,Math.max(0,Math.ceil(filtered.length/40)-1));$('#count').textContent=UI`${docs.length} 个文件 · ${rows.length} 组文本 · ${rows.filter(changed).length} 组已修改 · 筛选出 ${filtered.length} 组`;$('#rows').innerHTML=filtered.slice(page*40,page*40+40).map(r=>{const i=rows.indexOf(r),m=mark(r);return UI`<article class="row ${changed(r)?'changed':''}" data-row="${i}"><div class="row-head"><div class="context">${esc(r.doc.name)} · ${esc(r.context)}</div><span class="badge">${changed(r)?T('已修改'):T('未修改')}</span></div><div class="pair ${r.paths.length===1?'single':''}">${r.paths.map((p,j)=>`<label class="field">${r.langs[j]}<span class="path">${esc(pointer(p))}</span><textarea data-edit="${i}:${j}" spellcheck="false">${esc(get(r.doc.data,p))}</textarea>${$('#originals').checked?UI`<div class="original">原文：${esc(get(r.doc.original,p))}</div>`:''}</label>`).join('')}</div><div class="marks"><select data-status="${i}">${[['unreviewed',T('未校对')],['reviewed',T('已校对')],['check',T('待事实核查')]].map(([v,l])=>`<option value="${v}" ${m.status===v?'selected':''}>${l}</option>`).join('')}</select><input data-tags="${i}" placeholder="标签，如：缺来源、术语" value="${esc(m.tags)}"><input class="note" data-note="${i}" placeholder="核查备注（不写入业务 JSON）" value="${esc(m.note)}"><button data-revert="${i}">恢复本项原文</button><button data-sync="${i}" ${changed(r)?'':'disabled'}>同记录同步同文</button></div><div class="sources small">${sourceLinks(r)}</div></article>`}).join('')||T('<p>没有匹配文本。导入 JSON 或调整筛选条件。</p>');$('#pager').innerHTML=UI`<button id="prev" ${page?'':'disabled'}>上一页</button><span>${page+1} / ${Math.max(1,Math.ceil(filtered.length/40))}</span><button id="next" ${(page+1)*40<filtered.length?'':'disabled'}>下一页</button>`}
function refreshFiles(){const selected=$('#file-filter').value;$('#file-filter').innerHTML=T('<option value="">全部文件</option>')+docs.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('');if(docs.some(d=>d.id===selected))$('#file-filter').value=selected}
function add(name,data){docs.push({id:crypto.randomUUID(),name:name.replace(/[\\/]/g,'_'),original:clone(data),data:clone(data),marks:{}})}
$('#load-current').onclick=()=>{const current=JSON.parse($('#current-data').textContent);for(const [name,data] of Object.entries(current)){if(docs.some(d=>d.name===name)){notice(T('同名文件已载入，保留现有修改。'));continue}add(name,data)}refreshFiles();render();save()};
$('#files').onchange=async e=>{try{for(const file of e.target.files){if(file.size>20*1024*1024)throw Error(T('单文件超过 20 MB'));const value=JSON.parse(await file.text());if(value.format===K){if(!Array.isArray(value.docs)||value.docs.some(d=>!d.name||!d.marks||!('data'in d)||!('original'in d)))throw Error(T('校对工程结构不正确'));for(const d of value.docs){const item=clone(d);item.id=crypto.randomUUID();docs.push(item)}}else add(file.name,value)}page=0;refreshFiles();render();save()}catch(err){notice(err.message)}finally{e.target.value=''}};
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.edit){const [i,j]=el.dataset.edit.split(':').map(Number),r=rows[i];put(r.doc,r.paths[j],el.value);const card=el.closest('.row');card.classList.toggle('changed',changed(r));card.querySelector('.badge').textContent=changed(r)?T('已修改'):T('未修改');card.querySelector('[data-sync]').disabled=!changed(r);save()}for(const attr of ['tags','note'])if(el.dataset[attr]!==undefined){const r=rows[+el.dataset[attr]];r.doc.marks[r.key]={...mark(r),[attr]:el.value};save()}});
document.addEventListener('change',e=>{if(e.target.dataset.status!==undefined){const r=rows[+e.target.dataset.status];r.doc.marks[r.key]={...mark(r),status:e.target.value};save();render()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.revert!==undefined){const r=rows[+el.dataset.revert];r.paths.forEach(p=>put(r.doc,p,get(r.doc.original,p)));save();render()}if(el.dataset.sync!==undefined){const r=rows[+el.dataset.sync];let n=0;for(const target of rows.filter(x=>x.doc.id===r.doc.id&&pointer(x.rpath)===pointer(r.rpath))){target.paths.forEach((path,j)=>{const old=get(target.doc.data,path),language=target.langs[j];r.paths.forEach((p,k)=>{if(language===r.langs[k]&&old===r.original()[k]&&old!==r.values()[k]){put(target.doc,path,r.values()[k]);n++}})})}save();render();notice(UI`已同步同记录内 ${n} 处同文。`)}if(el.id==='prev'){page--;render()}if(el.id==='next'){page++;render()}});
for(const id of ['search','tag-filter'])$('#'+id).oninput=()=>{page=0;render()};for(const id of ['file-filter','change-filter','review-filter','technical','originals'])$('#'+id).onchange=()=>{page=0;render()};
function selectedDocs(){return docs.filter(d=>!$('#file-filter').value||d.id===$('#file-filter').value)}
$('#export-json').onclick=()=>{const ds=selectedDocs();if(!ds.length)return notice(T('请先载入 JSON'));if(ds.length===1)AtlasDownload.save(ds[0].name,JSON.stringify(ds[0].data,null,2));else AtlasDownload.save('corrected-json.zip',AtlasDownload.zip(ds.map((d,i)=>({name:`${i+1}-${d.name}`,text:JSON.stringify(d.data,null,2)}))));notice(T('已导出完整 JSON；文本筛选不会删除未显示的数据。'))};
$('#export-project').onclick=()=>AtlasDownload.save('proofreading-project.json',JSON.stringify({format:K,docs},null,2));
$('#export-changes').onclick=()=>{const changes=rows.filter(r=>changed(r)||mark(r).status!=='unreviewed'||mark(r).tags||mark(r).note).map(r=>({file:r.doc.name,paths:r.paths.map(pointer),original:r.original(),current:r.values(),...mark(r)}));AtlasDownload.save('proofreading-changes.json',JSON.stringify(changes,null,2))};
$('#restore').onclick=()=>{try{const stored=JSON.parse(localStorage.getItem(K)||'null');if(!stored?.docs)return notice(T('没有本机暂存'));if(docs.length)return notice(T('请在新开的校对页恢复暂存，避免覆盖当前会话。'));docs=stored.docs;refreshFiles();render();notice(T('已恢复本机暂存'))}catch(e){notice(e.message)}};render();

$('#studio-language').onchange=e=>{language=e.target.value;localStorage.setItem('atlas-studio-language',language);translateShell();render();};
</script></html>
